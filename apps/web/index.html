<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // 首帧前定好主题，避免闪一下另一种颜色（与 stores/theme.ts 一致）
      ;(() => {
        var pref = 'system'
        try {
          pref = localStorage.getItem('plein:theme') || 'system'
        } catch {}
        var light =
          pref === 'light' ||
          (pref !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        document.documentElement.style.colorScheme = light ? 'light' : 'dark'
      })()
    </script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" type="image/png" href="/plein-icon.png" sizes="1024x1024" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Plein</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
