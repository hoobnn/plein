name: Desktop (macOS)

# 手动触发，或推送 v* 标签时构建 macOS 安装包（Apple 芯片），产物在运行页的 Artifacts 里。
# 签名与公证按仓库密钥决定，都没配时做 ad-hoc 签名：
#   MAC_CERT_P12_BASE64、MAC_CERT_PASSWORD：Developer ID Application 证书（.p12，base64）
#   APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID：公证
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # ffmpeg 从源码构建（LGPL + libass + VideoToolbox），按脚本内容缓存
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/stage/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg.sh') }}
      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja pkgconf
          apps/desktop/scripts/build-ffmpeg.sh

      - run: pnpm install --frozen-lockfile
      - name: Build installer
        env:
          PLEIN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export PLEIN_VERSION=${PLEIN_VERSION#v}
          # 没配的 secret 会是空字符串，electron-builder 会把空的 CSC_LINK 当成路径，去掉才走 ad-hoc 签名
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          pnpm dist:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: plein-macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
