name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml 发版前复用同一套检查
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版本取自 package.json 的 packageManager
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # 界面冒烟：mock 平台起真服务，Playwright 驱动 Chromium 走完模板到导出。
  # 系统 ffmpeg 带 libass，加上中文字体，导出时连烧字幕一起验证
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  # 真实入库媒体与资源回收是硬门禁；同环境有基线时再比较时间，首次只归档报告。
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm perf
        env:
          PERF_N: "1000"
          PERF_ROUNDS: "3"
          PERF_OUTPUT: ${{ github.workspace }}/test-results/perf.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canvas-perf
          path: test-results/perf.json
          retention-days: 30
