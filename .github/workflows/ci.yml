name: CI

# 日常检查在本地 git 钩子里完成（pre-commit：vp staged；pre-push：pnpm verify），推送 main 不再触发。
# 云端只在三种情况下跑：PR（Dependabot）、release.yml 发版前复用、手动运行。
# e2e 只在本地跑：发版前本地跑完整 e2e，云端只跑检查与性能。
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "site/**"]
  # release.yml 发版前复用同一套检查
  workflow_call:
    inputs:
      perf-baseline-ref:
        description: 性能基线 tag 或 commit（留空取候选提交之前最近的 v* tag）
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      perf-baseline-ref:
        description: 性能基线 tag 或 commit（留空取候选提交之前最近的 v* tag）
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版本取自 package.json 的 packageManager
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - run: pnpm build

  # 同一 runner 顺序测量独立检出的基线和候选；夹具/环境/样本不匹配或明显回退均失败。
  # 只在发版和手动运行时跑，依赖升级 PR 不跑
  perf:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare baseline checkout
        env:
          REQUESTED_BASELINE: ${{ inputs.perf-baseline-ref }}
        run: |
          ref="${REQUESTED_BASELINE:-$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^)}"
          commit="$(git rev-parse --verify "${ref}^{commit}")"
          test "$commit" != "$(git rev-parse HEAD)"
          git worktree add --detach "$RUNNER_TEMP/plein-perf-baseline" "$commit"
          pnpm --dir "$RUNNER_TEMP/plein-perf-baseline" install --frozen-lockfile
      - run: pnpm perf:compare
        env:
          PERF_N: "1000"
          PERF_ROUNDS: "3"
          PERF_BASE_REF: ${{ inputs.perf-baseline-ref }}
          PERF_BASE_ROOT: ${{ runner.temp }}/plein-perf-baseline
          PERF_COMPARE_OUTPUT: ${{ github.workspace }}/test-results/perf-comparison
      - name: Remove baseline checkout
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/plein-perf-baseline"; then
            git worktree remove --force "$RUNNER_TEMP/plein-perf-baseline"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canvas-perf
          path: test-results/perf-comparison/
          retention-days: 30
