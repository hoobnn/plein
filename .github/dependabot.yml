version: 2

updates:
  # 根目录的共享 pnpm 锁文件覆盖整个 workspace。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "🔧 chore(deps): 更新依赖 "
    ignore:
      # 必须与 vite-plus 内置的 vitest 版本一致，随 vite-plus 升级手动对齐
      - dependency-name: "@vitest/coverage-v8"
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "👷 ci(deps): 更新 Actions "
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
