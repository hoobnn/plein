packages:
  - "apps/*"
  - "packages/*"

# esbuild 的安装脚本只做二进制自检，平台二进制来自可选依赖，不需要执行
allowBuilds:
  # TOS SDK 仅用于本地签名，不调用原生 CRC 上传实现
  tos-crc64-js: false
  esbuild: false
  # electron-builder 带的 Windows 安装器，只出 macOS 包时用不到
  electron-winstaller: false
  # JASSUB 依赖的本地字体查询垫片，安装脚本只是联网刷新内置字体名单，预览不查本机字体（queryFonts: false）
  lfa-ponyfill: false
  # 动态合成渲染器带的 puppeteer，安装脚本只是下载一份 Chrome；本机用系统 Chrome 或 PLEIN_HYPERFRAMES_CHROME_PATH 指定的即可
  puppeteer: false
# Vite+：vite 由 vite-plus-core 提供，插件和 vitest 依赖的 vite 都指向这一份
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
# 动态合成依赖的 hyperframes 包还没满最小发布年龄，先按确切版本放行
minimumReleaseAgeExclude:
  - "@hyperframes/core@0.8.186"
  - "@hyperframes/engine@0.8.186"
  - "@hyperframes/lint@0.8.186"
  - "@hyperframes/parsers@0.8.186"
  - "@hyperframes/producer@0.8.186"
  - "@hyperframes/sdk@0.8.186"
  - "@hyperframes/studio-server@0.8.186"
  - "@hyperframes/player@0.8.186"
overrides:
  vite@*: "catalog:"
  # @volcengine/tos-sdk 把 axios 锁在 ^0.21.1，0.21.4 带 10 项 high 漏洞；0.x 分支的修复版为 >=0.32.0
  axios: 0.34.0
  # undici 的 high 漏洞修复版：7.x 为 7.30.1、6.x 为 6.29.1；三处调用方的版本区间都容纳得了修复版
  "@ai-sdk/provider-utils>undici": 7.30.1
  "@electron/get>undici": 7.30.1
  "node-gyp>undici": 6.29.1
patchedDependencies:
  pixi.js@8.22.0: patches/pixi.js@8.22.0.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  pixi.js:
    build: true
    skills: true
# 已批准依赖提供的 agent skill 链接到这里（.claude/ 不进仓库，CI 的全新 clone 里没有，需显式指定）
skills:
  dirs:
    - .claude/skills
